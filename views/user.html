<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Vintage Games</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div class="logo">Vintage Games</div>
        <div class="header-right">
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Browse</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Login</a></li>
                    <li><a href="#">Cart 0</a></li>
                </ul>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="Search...">
                <button>GO</button>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="profile-container">
            <h1>User Profile</h1>
            
            <div class="profile-content">
                <div class="profile-sidebar">
                    <div class="profile-menu">
                        <div class="menu-item active">Settings</div>
                        <div class="menu-item">Account</div>
                        <div class="menu-item">Support</div>
                        <div class="menu-item">Payments</div>
                        <div class="menu-item">Wishlist</div>
                    </div>
                </div>
                
                <div class="profile-main">
                    <div class="profile-picture-section">
                        <h2>Profile Picture</h2>
                        <div class="profile-picture-container">
                            <div class="profile-picture"></div>
                            <button class="profile-button">Add Profile Pic</button>
                        </div>
                    </div>
                    
                    <div class="genres-section">
                        <h2>Genres</h2>
                        <div class="genres-grid">
                            <div class="genre-item">Action Adventure</div>
                            <div class="genre-item">Puzzle</div>
                            <div class="genre-item">2D side scroller</div>
                            <div class="genre-item">3D Platformer</div>
                            <div class="genre-item">Horror</div>
                        </div>
                    </div>
                    
                    <button class="sign-out-button">Sign Out</button>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <div class="footer-content">
            <div class="social-section">
                <h3>Where to Find Us</h3>
                <div class="social-icons">
                    <a href="#" class="social-icon instagram">Instagram</a>
                    <a href="#" class="social-icon facebook">Facebook</a>
                    <a href="#" class="social-icon twitter">Twitter</a>
                    <a href="#" class="social-icon linkedin">LinkedIn</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
