<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Vintage Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #3a3537;
      color: white;
      padding: 20px 10%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 10px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      background-color: #666;
      padding: 8px 16px;
      border-radius: 3px;
      transition: background-color 0.3s;
    }

    nav ul li a:hover {
      background-color: #888;
    }

    .container {
      max-width: 400px;
      margin: 60px auto;
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 2px solid #ddd;
      border-radius: 4px;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus {
      border-color: #888;
      outline: none;
    }

    .error-text {
      color: red;
      font-size: 14px;
      margin-top: 5px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #c4d82a;
      border: none;
      color: #333;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button[type="submit"]:hover {
      background-color: #b5c625;
    }

    p.text {
      text-align: center;
      margin-top: 20px;
    }

    p.text a {
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }

    p.text a:hover {
      text-decoration: underline;
    }

    footer {
      background-color: #3a3537;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
        <div class="logo">Vintage Games</div>
        <div class="header-right">
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/faq">FAQ</a></li>
                    <li><a href="/login">Login</a></li>
                    <li><a href="/profile">Profile</a></li>
                    <li><a href="/cart">Cart</a></li>
                </ul>
            </nav>
            </div>
        </div>
    </header>

  <div class="container">
    <h1>Login</h1>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required />
      </div>
      <button type="submit">Login</button>
      <p id="login-error" class="error-text"></p>
    </form>
    <p class="text">Don't have an account? <a href="/register">Register here</a></p>
  </div>

  <footer>
    &copy; 2025 Vintage Games. All rights reserved.
  </footer>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = e.target;
      const email = form.email.value;
      const password = form.password.value;

      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (res.ok) {
        window.location.href = '/';
      } else {
        const error = await res.text();
        document.getElementById('login-error').textContent = error || 'Login failed';
      }
    });
  </script>


</body>
</html>
