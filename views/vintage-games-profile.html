        body {

        header {
            background-color: #3c3836;

            font-size: 2.5rem;

        }
        
        .nav-menu {

        }
        
        .nav-button {
            background-color: #666;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .nav-button:hover {

        }
        
        main {

            padding: 20px;
            margin-bottom: 10px;
            font-size: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .sidebar-item:hover {
            background-color: #ccc;
        }
        
        .profile-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 30px;
        }
        
        .profile-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .profile-pic-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #ddd;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .add-pic-text {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .add-pic-text:hover {
            color: #666;
        }
        
        .sign-out-btn {
            background-color: #f05555;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .sign-out-btn:hover {
            background-color: #e03535;
        }
        
        .genres-section {
            width: 350px;
            background-color: #3c3836;
            color: white;
            padding: 20px;
        }
        
        .genres-title {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .genres-heading {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .genre-item {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .genre-item:hover {

        a {
            text-decoration: none;
            color: inherit;
