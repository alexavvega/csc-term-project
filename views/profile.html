<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Games - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            background-color: #fff;
            color: #333;
        }

        header {
            background-color: #3c3836;
            color: white;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            margin-left: 100px;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .nav-menu {
            margin-right: 30px;
        }

        .nav-button {
            background-color: #666;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .nav-button:hover {
            background-color: #888;
        }

        main {
            display: flex;
            justify-content: space-between;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .sidebar {
            width: 250px;
        }

        .sidebar-item {
            background-color: #ddd;
            padding: 20px;
            margin-bottom: 10px;
            font-size: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .sidebar-item:hover {
            background-color: #ccc;
        }

        .profile-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 30px;
        }

        .profile-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .profile-pic-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #ddd;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .add-pic-text {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .add-pic-text:hover {
            color: #666;
        }

        .sign-out-btn {
            background-color: #f05555;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .sign-out-btn:hover {
            background-color: #e03535;
        }

        .genres-section {
            width: 350px;
            background-color: #3c3836;
            color: white;
            padding: 20px;
        }

        .genres-title {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .genres-heading {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .genre-item {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .genre-item:hover {
            color: #aaa;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Vintage Games</div>
        <div class="header-right">
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/faq">FAQ</a></li>
                    <li><a href="/login">Login</a></li>
                    <li><a href="/profile">Profile</a></li>
                    <li><a href="/cart">Cart</a></li>
                </ul>
            </nav>
        </div>
        </div>
    </header>

    <main>
        <div class="sidebar">
        
            <a href="/profile">
                <div class="sidebar-item">Account</div>
            </a>
            <a href="/faq">
                <div class="sidebar-item">Support</div>
            </a>
            <a href="/cart">
                <div class="sidebar-item">Payments</div>
            </a>
        </div>

        <div class="profile-section">
            <h1 class="profile-title">Profile Picture</h1>
            <div class="profile-pic-container" id="profilePic"></div>
            <div class="add-pic-text" id="addPicText">Add Profile Pic</div>
            <a href="/auth/logout"><button class="sign-out-btn">Sign Out</button></a>
        </div>

       
    </main>

    <script>
        fetch('/api/user')
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    document.body.innerHTML = "<p>You are not logged in. <a href='/login'>Login</a></p>";
                    return;
                }

                // Set user name
                document.querySelector('.profile-title').textContent = `Hi, ${data.user.name}`;

                // Display purchase history
                const history = document.createElement('div');
                history.innerHTML = '<h2>Purchase History</h2>';
                const ul = document.createElement('ul');

                data.orders.forEach(order => {
                    const li = document.createElement('li');
                    li.textContent = `${order.product_name} - $${order.price.toFixed(2)} on ${new Date(order.created_at).toLocaleDateString()}`;
                    ul.appendChild(li);
                });

                history.appendChild(ul);
                document.querySelector('.profile-section').appendChild(history);
            });
    </script>
</body>

</html>
